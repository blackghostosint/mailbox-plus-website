name: Continuous Deployment - Netlify

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Astro dependencies
        run: cd astro && npm ci

      - name: Run verification doctor
        run: npm run verify:doctor

      - name: Run quality audits
        run: npm run audit:quality

      - name: TypeScript type check (Astro)
        run: cd astro && npm run check

      - name: Run Astro unit tests
        run: cd astro && npm test

      - name: Build site
        run: npm run build
        env:
          VITE_R2_PUBLIC_BASE_URL: ${{ secrets.VITE_R2_PUBLIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 1

  # NOTE (2026-09-21, owner-approved): the deploy-preview and deploy-production
  # jobs were removed. They had been silently no-oping — the repo lacks the
  # NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets, so both jobs logged
  # "Skipping Netlify deployment" as a warning and reported success anyway.
  # All real deploys (production + PR branch previews) are handled by
  # Netlify's own git integration. When CI is green here, everything ran.
