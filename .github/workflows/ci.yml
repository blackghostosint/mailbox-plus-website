name: CI - Build, Lint, Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Audit (root)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint check (zero warnings policy)
        run: npm run lint

      - name: Install Astro dependencies
        run: cd astro && npm ci

      - name: Dependency Security Audit (Astro)
        run: cd astro && npm audit --audit-level=high

      - name: TypeScript type check (Astro)
        run: cd astro && npm run check

      - name: Run Astro unit tests
        run: cd astro && npm test

      - name: Build project
        run: npm run build
        env:
          VITE_R2_PUBLIC_BASE_URL: ${{ secrets.VITE_R2_PUBLIC_BASE_URL }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Verify generated static assets drift
        run: git diff --exit-code public/llms.txt public/llms-full.txt

      - name: Check build output
        run: |
          npm run build 2>&1 | tee build-output.txt
          echo "Build completed. Output size:"
          du -sh dist | cut -f1

      - name: Run SEO route registry check
        run: npm run seo:check-routes

      - name: Run SEO JSON-LD absolute URLs check
        run: npm run seo:check-jsonld

      - name: Run SEO canonical trailing-slash check
        run: npm run seo:check-canonical

      - name: Run SEO internal href trailing-slash check
        run: npm run seo:check-href-slash

      - name: Check for unreferenced public/data files (legacy-drift guard)
        run: npm run check:public-data

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e:ci

      - name: Upload Playwright test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload build artifacts (on PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

