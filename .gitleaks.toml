# Gitleaks Configuration for Netlify Secret Scanning and CI Security Audits
title = "Gitleaks secret scanning configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for verified non-secret exact strings and designated test/example paths"
regexes = [
  '''chardon-returns-r1''',
  '''fedex-demand-surcharges-2026''',
  '''hambden-returns-r1''',
  '''kirtland-hills-returns-r1''',
  '''2027-fedex-ups-surcharge-forecast''',
  '''ups-2027-rate-increase'''
]
paths = [
  '''\.env\.example''',
  '''netlify/functions/__tests__/.*''',
  '''netlify/functions/lib/.*\.test\.ts''',
  '''astro/src/lib/__tests__/.*''',
  '''scripts/__tests__/.*''',
  '''tests/.*'''
]
