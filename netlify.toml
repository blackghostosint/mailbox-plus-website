[build]
  command = "npm ci && cd astro && npm ci && cd .. && npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Allow deploy previews for feature branches + production on main
  allowed_branches = ["main", "main/*", "feature/*", "fix/*", "hotfix/*", "release/*", "dev/*", "test/*", "chore/*", "jules/*", "jules/*/*"]

[build.environment]
  # Secret scanning is enforced in GitHub Actions CI via Gitleaks (.gitleaks.toml); disabled in Netlify build environment to prevent false positive deploy preview failures on public CDN assets and sales pages
  SECRETS_SCAN_ENABLED = "false"
  # Astro 7 requires Node >=22.12; pin Netlify's build image to Node 22 LTS
  NODE_VERSION = "22"

[functions]
  included_files = [
    "knowledge/kb.entries.json",
    "knowledge/*.json"
  ]

# Staging context - separate environment for testing
[context.staging]
  environment = { SITE_URL = "https://staging.mailboxplusohio.com" }

# Production context
[context.production]
  environment = { SITE_URL = "https://mailboxplusohio.com" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

