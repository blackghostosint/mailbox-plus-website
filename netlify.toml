[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat/retrieve"
  to = "/.netlify/functions/chat-retrieve"
  status = 200

[functions]
  included_files = ["knowledge/kb.entries.json", "knowledge/.embedding-cache.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
