[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = [
    "knowledge/kb.entries.json",
    "knowledge/embeddings.json"
  ]

# Staging context - separate environment for testing
[context.staging]
  environment = { SITE_URL = "https://staging.mailboxplusohio.com" }

# Production context
[context.production]
  environment = { SITE_URL = "https://mailboxplusohio.com" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = """ 
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' https://pub-21518ce3034449a3a7b5a0b89551f710.r2.dev;
      connect-src 'self' https://www.google.com;
      frame-src 'self' https://www.googletagmanager.com;
      report-uri https://mailboxplusohio.com/.netlify/functions/csp-report;
      report-to csp-endpoint;
    """
  [headers.values.report-to]
    csp-endpoint = '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://mailboxplusohio.com/.netlify/functions/csp-report"}]}'
