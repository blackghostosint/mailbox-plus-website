[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Allow deploy previews for feature branches + production on main
  allowed_branches = ["main", "main/*", "feature/*", "fix/*", "hotfix/*", "release/*", "dev/*", "test/*"]

[build.environment]
  # Disable secrets scanning to prevent build failures from false positives on public CDN assets and HTML sales pages
  SECRETS_SCAN_ENABLED = "false"

[functions]
  included_files = [
    "knowledge/kb.entries.json",
    "knowledge/embeddings.json"
  ]

# Staging context - separate environment for testing
[context.staging]
  environment = { SITE_URL = "https://staging.mailboxplusohio.com" }

# Production context
[context.production]
  environment = { SITE_URL = "https://mailboxplusohio.com" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.google.com https://ssl.gstatic.com https://www.googleapis.com https://www.gstatic.com https://identity.netlify.com https://connect.facebook.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' https://*.r2.dev https://pub-4515923f088c4228b1756250c1b20c6f.r2.dev https://*.netlify.app https://www.facebook.com https://www.google.com data:;
      connect-src 'self' https://www.google.com https://mailboxplusohio.com https://*.netlify.app https://ingesteer.services-prod.nsvcs.net https://identity.netlify.com;
      frame-src 'self' https://www.google.com https://www.recaptcha.net https://app.netlify.com https://identity.netlify.com;
      report-uri https://mailboxplusohio.com/.netlify/functions/csp-report;
      report-to csp-endpoint;
    """
  [headers.values.report-to]
    csp-endpoint = '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://mailboxplusohio.com/.netlify/functions/csp-report"}]}'

# Noindex + security for staff invitation page
[[headers]]
  for = "/accept-invite*"
  [headers.values]
    X-Robots-Tag = "none"
