<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Mailbox Plus Concord Township Ohio Pack and Ship</title>
    <!-- Self-hosted font preloads (critical for LCP) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/poppins-regular.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/opensans-regular.woff2"
    />
    <!-- Critical CSS (inlined for above-fold content) -->
    <style>
      /* Critical CSS - Inlined for above-fold content */
      /* CSS Custom Properties */
      :root {
        --color-primary: #285a8e;
        --color-primary-dark: #1f3f63;
        --color-primary-deeper: #1a3554;
        --color-primary-deep: #162c45;
        --color-accent: #f4c542;
        --color-accent-light: #f7d46a;
        --color-alt-accent: #ebc044;
        --color-bg-primary: #faf8f3;
        --color-bg-secondary: #f5f2ec;
        --color-bg-blue-tint: #eaf4fb;
        --color-bg-cyan-tint: #e8f6fc;
        --color-text-primary: #1f2933;
        --color-text-secondary: #4a5568;
        --color-text-muted: #667085;
        --color-border: #e6e0d6;
        --color-border-blue: #c8ddee;
        --color-gradient-start: #285a8e;
        --color-gradient-mid: #1f3f63;
        --color-gradient-end: #162c45;
        --color-overlay: #1f2933;
        --color-overlay-blue: #285a8e;
        --color-shadow: #1f2933;
        --shadow-sm: 0 10px 30px rgba(var(--color-shadow), 0.04);
        --shadow-md: 0 10px 30px rgba(var(--color-shadow), 0.08);
        --shadow-lg: 0 18px 45px rgba(var(--color-overlay), 0.1);
        --shadow-xl: 0 26px 65px rgba(var(--color-overlay), 0.25);
        --surface-subtle: rgba(255, 255, 255, 0.5);
        --surface-medium: rgba(255, 255, 255, 0.6);
        --surface-strong: rgba(255, 255, 255, 0.7);
        --surface-heavy: rgba(255, 255, 255, 0.8);
      }
      /* Self-hosted Fonts */
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-semibold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Open Sans';
        src: url('/fonts/opensans-regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Open Sans';
        src: url('/fonts/opensans-medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Open Sans';
        src: url('/fonts/opensans-semibold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Open Sans';
        src: url('/fonts/opensans-bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /* Font Fallback Metrics for CLS Prevention */
      @font-face {
        font-family: 'Poppins Fallback';
        src: local('system-ui');
        size-adjust: 92.5%;
        ascent-override: 90%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Open Sans Fallback';
        src: local('system-ui');
        size-adjust: 100%;
        ascent-override: 88%;
        descent-override: 22%;
        line-gap-override: 0%;
      }
      /* Tailwind Base Reset (minimal) */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
      }
      *::before,
      *::after {
        --tw-content: '';
      }
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        -moz-tab-size: 4;
        tab-size: 4;
        font-family:
          Open Sans,
          Open Sans Fallback,
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        line-height: inherit;
        font-family: inherit;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size: inherit;
        font-weight: inherit;
        font-family:
          Poppins,
          Poppins Fallback,
          system-ui,
          -apple-system,
          sans-serif;
      }
      /* Hero Section (Above Fold) */
      .hero-gradient {
        background: linear-gradient(
          to bottom right,
          var(--color-gradient-start),
          var(--color-gradient-mid),
          var(--color-gradient-end)
        );
      }
      .hero-fade {
        bottom: 0;
        left: 0;
        right: 0;
        height: 6rem;
        background-image: linear-gradient(to bottom, transparent, var(--color-bg-primary));
      }
      .text-gradient-white {
        color: white;
        font-weight: 700;
      }
      /* Header (Sticky) */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: white;
        border-bottom: 1px solid var(--color-border);
      }
      .nav-link {
        font-size: 0.875rem;
        font-weight: 500;
        transition: color;
      }
      .nav-link-external {
        font-weight: 700;
        color: var(--color-primary);
      }
      .nav-link-external:hover {
        color: var(--color-primary-dark);
      }
      .nav-link-internal {
        color: var(--color-text-secondary);
      }
      .nav-link-internal:hover {
        color: var(--color-primary);
      }
      .nav-link-active {
        color: var(--color-primary);
      }
      /* Animations */
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.8s ease-out forwards;
      }
      @keyframes fade-out-down {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(30px);
        }
      }
      .animate-fade-out-down {
        animation: fade-out-down 0.8s ease-out forwards;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.8s ease-out forwards;
      }
      /* Buttons (Critical) */
      .btn-primary {
        background: var(--color-primary);
        color: white;
        font-weight: 600;
        border-radius: 0.75rem;
        padding: 0.75rem 1.5rem;
        box-shadow: var(--shadow-md);
        transition: all 0.2s;
      }
      .btn-primary:hover {
        background: var(--color-primary-dark);
        box-shadow: var(--shadow-lg);
      }
      .btn-secondary {
        border: 2px solid var(--color-primary);
        color: var(--color-primary);
        background: white;
        font-weight: 600;
        border-radius: 0.75rem;
        padding: 0.75rem 1.5rem;
        transition: all 0.2s;
      }
      .btn-secondary:hover {
        background: var(--color-bg-blue-tint);
        border-color: var(--color-primary-dark);
        box-shadow: var(--shadow-md);
      }
      .btn-ghost {
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        border-radius: 0.75rem;
        padding: 0.75rem 1.5rem;
        transition: all 0.2s;
      }
      .btn-ghost:hover {
        background: var(--color-bg-blue-tint);
      }
      /* Min-height for touch targets */
      .min-h-touch {
        min-height: 48px;
      }
      /* Logo aspect ratio */
      .aspect-logo {
        aspect-ratio: 256/80;
      }
      /* Layout utilities */
      .max-w-container {
        max-width: 80rem;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1.5rem;
      }
      @media (min-width: 640px) {
        .max-w-container {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }
      }
      @media (min-width: 1024px) {
        .max-w-container {
          padding-left: 2rem;
          padding-right: 2rem;
        }
      }
      /* Hide scrollbar for animations */
      @media (prefers-reduced-motion: reduce) {
        .animate-fade-in,
        .animate-fade-in-up,
        .animate-fade-out-down {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-M48D4D56"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
